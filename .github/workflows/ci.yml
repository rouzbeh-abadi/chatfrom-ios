# Builds the package and runs its unit tests on an iPhone simulator, and builds
# the two example apps, on every push to main and every pull request. The UI
# tests in Example/ need the Node test server and take a quarter of an hour, so
# they run on a Mac: README.md, Tests, says how.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and unit tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The newest iPhone on an iOS that the runner's Xcode supports: a simulator named in this file would stop the job when the runner
      # image moves on, and a newer runtime than the Xcode's SDK cannot run the tests. A runtime for one device only, such as
      # iOS-27-2-iPhone19-4, is passed over. Booted and waited for, or the tests can find it busy.
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid=$(python3 -c '
          import json, re, subprocess
          sdks = json.loads(subprocess.check_output(["xcodebuild", "-showsdks", "-json"]))
          sdk = max(tuple(map(int, s["platformVersion"].split(".")))[:2] for s in sdks if s.get("platform") == "iphonesimulator")
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          versions = {r: tuple(map(int, m.groups())) for r in devices if (m := re.fullmatch(r".*\.iOS-(\d+)-(\d+)", r))}
          usable = sorted((r for r in versions if versions[r] <= sdk), key=versions.get, reverse=True)
          print(next(d["udid"] for r in usable for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$udid" -b

      - name: Unit tests
        run: xcodebuild test -quiet -scheme ChatFrom -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"

  examples:
    name: Build the example apps
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The project is made from Example/project.yml, as README.md says; it is not in the repository.
      - name: Make the example project
        run: |
          brew install xcodegen
          cd Example && xcodegen generate

      - name: Build the SwiftUI and UIKit apps
        run: |
          for scheme in ChatFromExample ChatFromExampleUIKit; do
            xcodebuild build -quiet -project Example/ChatFromExample.xcodeproj -scheme "$scheme" -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO
          done
