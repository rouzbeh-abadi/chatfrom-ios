version: 2

# The actions the workflows pin by commit (ci.yml), which nothing else would
# move. The package has no dependencies of its own. A new release waits a week
# before it is proposed, so one published from a stolen account is more likely
# found and pulled first.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
